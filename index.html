<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Web Layout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            padding: 20px;
        }

        .item {
            box-sizing: border-box;
            text-align: center;
            border: 1px solid #ccc;
            padding: 10px;
        }

        .item img {
            width: 100%;
            height: auto;
        }

        .item p {
            margin: 10px 0;
        }

        .item button {
            padding: 10px;
            background-color: #d98cb3;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        @media (min-width: 992px) {
            .item {
                flex: 1 1 calc(25% - 20px); /* 4 items 1 dòng */
            }

            .item p {
                font-size: 18px; /* Cỡ chữ lớn nhất */
            }
        }

        @media (min-width: 768px) and (max-width: 991px) {
            .item {
                flex: 1 1 calc(50% - 20px); /* 2 items 1 dòng */
            }

            .item p {
                font-size: 16px; /* Cỡ chữ theo phần trăm màn hình */
            }
        }

        @media (max-width: 767px) {
            .item {
                flex: 1 1 100%; /* 1 item 1 dòng */
            }

            .item p {
                font-size: 14px; /* Cỡ chữ nhỏ nhất */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">
            <img src="flower.jpg" alt="Flower">
            <p>Lorem ipsum dolor sit amet...</p>
            <button>Live</button>
        </div>
        <div class="item">
            <img src="flower.jpg" alt="Flower">
            <p>Lorem ipsum dolor sit amet...</p>
            <button>Live</button>
        </div>
        <div class="item">
            <img src="flower.jpg" alt="Flower">
            <p>Lorem ipsum dolor sit amet...</p>
            <button>Live</button>
        </div>
        <div class="item">
            <img src="flower.jpg" alt="Flower">
            <p>Lorem ipsum dolor sit amet...</p>
            <button>Live</button>
        </div>
    </div>
</body>
</html>
